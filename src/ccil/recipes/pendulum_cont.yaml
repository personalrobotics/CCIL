# Recipe migrated from the legacy config/pendulum_cont.yml by ccil.config.migrate (version 0 -> 1).
# Values are the legacy task values; only keys and representation changed.
config_version: 1
run: {seed: 42, output_dir: output/}
compute: {device: cuda}
data: {path: data/pendulum_cont_100.npz, validation_fraction: 0.2}
environment: {id: PendulumSwingupCont-v0}
transition_model:
  lipschitz_type: soft_sampling
  lipschitz_constraint: 2.0
  soft_penalty_weight: 0.001
  soft_sampling_eps: 0.0003
  soft_samples: 5
  learning_rate: 0.001
  weight_decay: 1.0e-05
  hidden_layers: [512, 512]
  activation: relu
  epochs: 100
  batch_size: 512
generation: {method: noisy_action, max_iterations: 30, labels_per_transition: 20,
  action_noise_std: 1.0e-05, support_radius: 1.0}
policy: {method: ccil, learning_rate: 0.001, batch_size: 512, epochs: 100, balance_noisy_labels: false}
evaluation:
  noise_levels: [0.0]
